# SearXNG Configuration for Interview Intelligence Platform
# Enables JSON format API for unlimited automated open-web discovery

use_default_settings: true

general:
  debug: false
  instance_name: "Interview Intelligence Search Engine"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  languages:
    - en
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "interview-intelligence-searxng-secret-key-32chars!"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: true

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 5.0
    disabled: false

  - name: google
    engine: google
    shortcut: g
    timeout: 5.0
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    timeout: 5.0
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    timeout: 5.0
    disabled: false
