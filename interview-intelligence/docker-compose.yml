version: '3.8'

services:
  # PostgreSQL with pgvector extension enabled
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview_intelligence_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-interview_intelligence}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ollama for 100% Free Local Model Inference (Nemotron / Qwen2.5)
  ollama:
    image: ollama/ollama:latest
    container_name: interview_intelligence_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Uncomment to enable NVIDIA GPU passthrough if nvidia container toolkit is installed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # FastAPI Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_intelligence_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/interview_intelligence
      - OLLAMA_BASE_URL=http://ollama:11434
      - APP_ENV=production
    ports:
      - "8000:8000"
      - "8001:8001"
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Streamlit Analytics & Review Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview_intelligence_dashboard
    restart: always
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  postgres_data:
  ollama_models:
