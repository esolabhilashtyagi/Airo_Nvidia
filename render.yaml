services:
  # ----------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------
  - type: web
    name: aairo-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.core.bootstrap_public_content && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aairo-db
          property: connectionString
      - key: ALEMBIC_ALLOWED_DB
        # Must exactly match the managed PostgreSQL databaseName below.
        value: aairo_db
      - key: PUBLIC_CONTENT_BOOTSTRAP_ALLOWED_DB
        # Exact allowlist for idempotent baseline taxonomy, learning content, and question bank.
        value: aairo_db
      - key: AI_PROVIDER
        value: nvidia
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: CORS_ORIGINS
        value: '["https://aairo-frontend.onrender.com"]'
      - key: INITIAL_ADMIN_EMAIL
        value: admin@aairo.ai
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      # SMTP credentials are entered in Render's service environment and are
      # intentionally not managed or overwritten by Blueprint syncs.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_SSL
        sync: false
      - key: SMTP_STARTTLS
        sync: false
      - key: SMTP_TIMEOUT_SECONDS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

  # ----------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------
  - type: web
    name: aairo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aairo-backend.onrender.com/api/v1

# ----------------------------------------------------
# 3. PostgreSQL Managed Database
# ----------------------------------------------------
databases:
  - name: aairo-db
    databaseName: aairo_db
    user: aairo_user
    plan: free
    region: oregon
